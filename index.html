<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de Produção — Galpão Una</title>

<!--
  O PAINEL MUDOU DE CASA (28/08/2026).

  Ele agora mora dentro do chat, em https://chat-galpaouna.vercel.app/painel —
  no mesmo lugar do resto do sistema. O motivo foi concreto: a ponte entre o
  painel e o chat tem dois lados, e mudar os dois exigia dois repositórios e
  dois PRs. Um deles ficou pra trás numa mesclagem e a TV passou dias sem
  sincronizar entre os aparelhos.

  Esta página existe pra TV se mudar SOZINHA. Ninguém precisa digitar endereço
  novo: quem abrir o link antigo — a TV do galpão, um favorito no celular, o
  atalho na área de trabalho — cai direto na casa nova.

  O redirecionamento é feito de três jeitos, de propósito, porque a TV é um
  aparelho velho e não dá pra saber qual deles ela obedece:
    1. o <meta refresh>, que funciona sem JavaScript nenhum;
    2. o <script>, que é instantâneo e substitui o histórico (assim o botão
       "voltar" não fica preso num pingue-pongue entre os dois endereços);
    3. o link visível, se os dois primeiros falharem.
-->
<meta http-equiv="refresh" content="0; url=https://chat-galpaouna.vercel.app/painel">
<link rel="canonical" href="https://chat-galpaouna.vercel.app/painel">

<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    background: #0a0a0a; color: #f3efe5;
    font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    text-align: center; padding: 24px;
  }
  h1 { font-size: 1.4rem; margin: 0; letter-spacing: .02em; text-transform: uppercase; }
  p { margin: 0; color: #9b9384; max-width: 40ch; line-height: 1.6; }
  a {
    color: #0a0a0a; background: #c89a3a; text-decoration: none;
    padding: 12px 22px; border-radius: 6px; font-weight: 700;
  }
  a:focus-visible { outline: 2px solid #f3efe5; outline-offset: 3px; }
</style>
</head>
<body>
  <h1>O painel mudou de casa</h1>
  <p>Ele agora abre dentro do sistema, junto com o resto. Se esta tela não
     passar sozinha em alguns segundos, toque no botão.</p>
  <a href="https://chat-galpaouna.vercel.app/painel">Abrir o painel</a>

  <script>
    // replace, não href: assim o "voltar" não devolve pra esta página e
    // ninguém fica preso num pingue-pongue entre os dois endereços.
    location.replace('https://chat-galpaouna.vercel.app/painel');
  </script>
</body>
</html>
